<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>View Product</title>

  <link rel="stylesheet" href="css/view-product.css" />
</head>

<body>


<div class="container">


<!-- Sidebar -->

<div class="sidebar">

<h2>🛒 Grocery IMS</h2>

<a href="dashboard.html">Dashboard</a>

<a href="product.html">Products</a>

<a href="supplier-list.html">Suppliers</a>

<a href="#">Reports</a>

<a href="#">Settings</a>

<a href="#" onclick="logoutPage()">Logout</a>


</div>




<!-- Main -->

<div class="main">


<a href="product.html" class="back">
← Back to Products
</a>




<div class="product-card">



<div class="image-section">


<img 
id="mainImage" 
class="main-image" 
src="" 
alt="Product">



<div class="small-images">

<img id="img1" src="" alt="">

<img id="img2" src="" alt="">

<img id="img3" src="" alt="">


</div>


</div>





<div class="details">



<div class="top">

<h2 id="productName"></h2>

<span 
class="stock" 
id="stock">
</span>


</div>




<p>
<strong>Product ID:</strong>
<span id="productId"></span>
</p>



<p>
<strong>Supplier:</strong>
<span id="supplier"></span>
</p>




<p>
<strong>Price:</strong>
<span id="price"></span>
</p>



<p>
<strong>Quantity:</strong>
<span id="quantity"></span>
</p>




<p>
<strong>Category:</strong>
<span id="category"></span>
</p>





<p>

<strong>Description:</strong>
<br>

<span id="description"></span>

</p>




<p>
<strong>Created At:</strong>
<span id="created"></span>
</p>



<div class="buttons">


<button 
class="edit"
onclick="editProduct()">

Edit

</button>



<button 
class="delete"
onclick="deleteProduct()">

Delete

</button>



</div>



</div>



</div>



</div>


</div>






<script>


const productId =
localStorage.getItem("productId");





// Get product from database


async function loadProduct(){


try{


const response = await fetch(

`/api/products/${productId}`

);



const product = await response.json();





document.getElementById("productName").innerText =
product.name;



document.getElementById("productId").innerText =
product.id;



document.getElementById("supplier").innerText =
product.supplier || "N/A";



document.getElementById("price").innerText =
"Rs." + product.price;



document.getElementById("quantity").innerText =
product.quantity;



document.getElementById("category").innerText =
product.category;



document.getElementById("description").innerText =
product.description;



document.getElementById("created").innerText =
product.created_at;




// stock status

if(product.quantity < 5){

document.getElementById("stock").innerText =
"Low Stock";

}

else{

document.getElementById("stock").innerText =
"In Stock";

}





// image


const imagePath = 
"/uploads/" + product.image;


document.getElementById("mainImage").src = imagePath;


document.getElementById("img1").src = imagePath;


document.getElementById("img2").src = imagePath;


document.getElementById("img3").src = imagePath;



}

catch(error){

console.log(error);

alert("Product loading failed");

}


}






// Edit button


function editProduct(){

window.location.href =
"edit-product.html";

}







// Delete button


async function deleteProduct(){


let confirmDelete =
confirm(
"Are you sure you want to delete this product?"
);



if(!confirmDelete)
return;



await fetch(

`/api/products/${productId}`,

{

method:"DELETE"

}

);



alert("Product deleted successfully");



window.location.href =
"product.html";



}





loadProduct();


</script>




<script src="js/script.js"></script>


</body>
</html>
