<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<div class="container">

    <div class="sidebar">
        <h2>🛒 Grocery IMS</h2>

        <a href="dashboard.html">Dashboard</a>
        <a href="#" onclick="productsPage()">Products</a>
        <a href="supplier-list.html">Suppliers</a>
        <a href="#" onclick="reportsPage()">Reports</a>
        <a href="#" onclick="settingsPage()">Settings</a>
        <a href="#" onclick="logoutPage()">Logout</a>
    </div>

    <div class="main">

        <h1>Reports</h1>

        <div class="cards">

            <div class="card">
                <h3>Total Products</h3>
                <p id="totalProducts">0</p>
            </div>

            <div class="card">
                <h3>Low Stock Items</h3>
                <p id="lowStock">0</p>
            </div>

            <div class="card">
                <h3>Total Suppliers</h3>
                <p id="totalSuppliers">0</p>
            </div>

            <div class="card">
                <h3>Total Inventory Value</h3>
                <p id="inventoryValue">Rs. 0</p>
            </div>

        </div>

        <div class="table-section">

            <h2>Monthly Inventory Report</h2>

            <table>

                <tr>
                    <th>Report Type</th>
                    <th>Total</th>
                </tr>

                <tr>
                    <td>Products Added</td>
                    <td id="productsAdded">0</td>
                </tr>

                <tr>
                    <td>Products Updated</td>
                    <td id="productsUpdated">0</td>
                </tr>

                <tr>
                    <td>Low Stock Products</td>
                    <td id="lowStockProducts">0</td>
                </tr>

                <tr>
                    <td>Suppliers Registered</td>
                    <td id="suppliersRegistered">0</td>
                </tr>

            </table>

        </div>

        <div class="buttons">
            <button onclick="printReport()">Print Report</button>
            <button onclick="exportPDF()">Export PDF</button>
        </div>

    </div>

</div>

<script>

async function loadReport(){

    try{

        const productsResponse = await fetch(
            "/api/products"
        );

        const products = await productsResponse.json();

        const suppliersResponse = await fetch(
            "/api/suppliers"
        );

        const suppliers = await suppliersResponse.json();

        const totalProducts = products.length;

        const totalSuppliers = suppliers.length;

        const lowStock = products.filter(product =>
            Number(product.quantity) < 5
        ).length;

        let inventoryValue = 0;

        products.forEach(product => {

            inventoryValue +=
            Number(product.price) *
            Number(product.quantity);

        });

        document.getElementById("totalProducts").innerText =
        totalProducts;

        document.getElementById("lowStock").innerText =
        lowStock;

        document.getElementById("totalSuppliers").innerText =
        totalSuppliers;

        document.getElementById("inventoryValue").innerText =
        "Rs. " + inventoryValue;

        document.getElementById("productsAdded").innerText =
        totalProducts;

        document.getElementById("productsUpdated").innerText =
        totalProducts;

        document.getElementById("lowStockProducts").innerText =
        lowStock;

        document.getElementById("suppliersRegistered").innerText =
        totalSuppliers;

    }

    catch(error){

        console.log(error);
        alert("Cannot load report data");

    }

}

loadReport();

</script>

<script src="js/script.js"></script>

</body>
</html>
