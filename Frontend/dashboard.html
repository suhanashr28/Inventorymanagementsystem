<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grocery Dashboard</title>
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
        <h2>🛒 Grocery IMS</h2>

        <a href="dashboard.html">Dashboard</a>

        <a href="#" onclick="productsPage()">Products</a>

        

        <a href="#" onclick="suppliersPage()">Suppliers</a>

        <a href="#" onclick="reportsPage()">Reports</a>

        <a href="#" onclick="settingsPage()">Settings</a>

        <a href="#" onclick="logoutPage()">Logout</a>
      </div>

      <div class="main">
        <h1>Dashboard</h1>
        <div class="cards">

  <div class="card">
    <h3>Total Products</h3>
    <p id="totalProducts">0</p>
  </div>

  <div class="card">
    <h3>Available Stock</h3>
    <p id="availableStock">0</p>
  </div>

  <div class="card">
    <h3>Low Stock</h3>
    <p id="lowStock">0</p>
  </div>

  <div class="card">
    <h3>Suppliers</h3>
    <p id="totalSuppliers">0</p>
  </div>

  <div class="card">
    <h3>Total Value</h3>
    <p id="totalValue">Rs. 0</p>
  </div>

</div>
      <div class="table-section">
  <h2>Low Stock Products</h2>

  <table>
    <thead>
      <tr>
        <th>Product</th>
        <th>Category</th>
        <th>Quantity</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="lowStockTable">
    </tbody>
  </table>
</div>  
          

        
    <script>

async function loadDashboard(){

  try{

    const productsResponse =
    await fetch("/api/products");

    const products =
    await productsResponse.json();

    const suppliersResponse =
    await fetch("/api/suppliers");

    const suppliers =
    await suppliersResponse.json();

    document.getElementById("totalProducts").innerText =
    products.length;

    document.getElementById("totalSuppliers").innerText =
    suppliers.length;

    let totalStock = 0;
    let totalValue = 0;
    let lowStockProducts = [];

    products.forEach(product => {

      totalStock += Number(product.quantity);

      totalValue +=
      Number(product.price) *
      Number(product.quantity);

      if(Number(product.quantity) < 5){
        lowStockProducts.push(product);
      }

    });

    document.getElementById("availableStock").innerText =
    totalStock;

    document.getElementById("lowStock").innerText =
    lowStockProducts.length;

    document.getElementById("totalValue").innerText =
    "Rs. " + totalValue;

    let html = "";

    lowStockProducts.forEach(product => {

      html += `
      <tr>
        <td>${product.name}</td>
        <td>${product.category}</td>
        <td>${product.quantity}</td>
        <td class="low">Low Stock</td>
      </tr>
      `;

    });

    document.getElementById("lowStockTable").innerHTML =
    html;

  }

  catch(error){

    console.log(error);

  }

}

loadDashboard();

</script>
    <script src="js/script.js"></script>
   
  </body>
</html>
