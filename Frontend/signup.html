<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signup</title>
<link rel="stylesheet" href="css/signup.css">
<link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<div class="container">

  <div class="left">
    <h2>📦 InventoryPro</h2>
    <p>Create your account</p>
  </div>

  <div class="right">

    <div class="signup-box">

      <h1>Create Account</h1>
      <p>Fill in the details below</p>

      <form id="signupForm">

        <label>Full Name</label>
        <input
          type="text"
          id="name"
          placeholder="Enter your full name"
          required
        >

        <label>Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label>Password</label>
        <div class="password-field">
          <input
            type="password"
            id="password"
            placeholder="Create password"
            minlength="8"
            autocomplete="new-password"
            required
          >
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">👁</button>
        </div>
        <p class="password-help">At least 8 characters, with uppercase, lowercase, a number, and a special character (for example, #).</p>

        <label>Confirm Password</label>
        <div class="password-field">
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm password"
            minlength="8"
            autocomplete="new-password"
            required
          >
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">👁</button>
        </div>

        <label class="agreement">
          <input type="checkbox" id="agreeTerms" required>
          I agree to the Terms and Privacy Policy
        </label>

        <button type="submit">
          Sign Up
        </button>

        <p id="message"></p>

        <p class="login-link">
          Already have an account?
          <a href="login.html">Login</a>
        </p>

      </form>

    </div>

  </div>

</div>

<script src="js/signup.js"></script>

</body>
</html>
