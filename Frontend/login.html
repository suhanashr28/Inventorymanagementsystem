<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<div class="container">

  <div class="left">
    <h2>📦 InventoryPro</h2>
    <p>Your Inventory, Our Priority</p>
  </div>

  <div class="right">

    <div class="login-box">

      <h1>Welcome Back!</h1>
      <p>Login to your account</p>

      <form id="loginForm">

        <label>Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label>Password</label>
        <div class="password-field">
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            minlength="8"
            autocomplete="current-password"
            required
          >
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/><path class="eye-slash" d="m4 4 16 16"/></svg>
          </button>
        </div>

        <div class="options">
          <label>
            <input type="checkbox" id="rememberMe" required>
            Remember Me
          </label>

          <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <button type="submit">
          Login
        </button>

        <p id="message"></p>

        <p class="signup">
          Don't have an account?
          <a href="signup.html">Sign Up</a>
        </p>

      </form>

    </div>

  </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
