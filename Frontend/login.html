<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="stylesheet" href="css/login.css">
</head>

<body>

<div class="container">

  <div class="left">
    <h2>📦 InventoryPro</h2>
    <p>Your Inventory, Our Priority</p>
  </div>

  <div class="right">

    <div class="login-box">

      <h1>Welcome Back!</h1>
      <p>Login to your account</p>

      <form id="loginForm">

        <label>Email Address</label>
        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >

        <label>Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          minlength="8"
          autocomplete="current-password"
          required
        >

        <div class="options">
          <label>
            <input type="checkbox">
            Remember Me
          </label>

          <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <button type="submit">
          Login
        </button>

        <p id="message"></p>

        <p class="signup">
          Don't have an account?
          <a href="signup.html">Sign Up</a>
        </p>

      </form>

    </div>

  </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
