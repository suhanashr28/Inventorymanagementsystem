<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Suppliers</title>

    <link rel="stylesheet" href="css/supplier-list.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <div class="sidebar">
    <h2>🛒 Grocery IMS</h2>

    <a href="dashboard.html">Dashboard</a>

    <a href="#" onclick="productsPage()">Products</a>

    <a href="supplier-list.html">Suppliers</a>

    <a href="#" onclick="reportsPage()">Reports</a>

    <a href="#" onclick="settingsPage()">Settings</a>

    <a href="#" onclick="logoutPage()">Logout</a>
</div>
      

      <div class="main">
        <div class="top-bar">
          <h1>Suppliers</h1>

          <input type="text" placeholder="Search supplier..." />

          <button onclick="addSupplierPage()">Add Supplier</button>
        </div>

        <div class="table-container">
          <table>
            <tr>
              <th>Name</th>
              <th>Contact Email</th>
              <th>Phone</th>
              <th>Products</th>
              <th>Actions</th>
            </tr>
            <tbody id="supplierTable"></tbody>
              
          </table>
        </div>
      </div>
    </div>
    <script>

async function loadSuppliers(){

try{

const response = await fetch(
"/api/suppliers",
{ cache: "no-store" }
);

if(!response.ok){
    throw new Error("Failed to load suppliers");
}

const suppliers = await response.json();

let html = "";

suppliers.forEach(supplier => {

html += `
<tr>
<td>${supplier.name}</td>
<td>${supplier.email}</td>
<td>${supplier.phone}</td>
<td>${supplier.products}</td>
<td class="actions">
<i class="fa-solid fa-eye"
onclick="viewSupplier(${supplier.id})"></i>

<i class="fa-solid fa-pen"
onclick="editSupplier(${supplier.id})"></i>

<i class="fa-solid fa-trash"
onclick="deleteSupplier(${supplier.id})"></i>
</td>
</tr>
`;

});

document.getElementById("supplierTable").innerHTML = html;

}

catch(error){

console.log(error);
alert("Cannot load suppliers");

}

}

function viewSupplier(id){

localStorage.setItem("supplierId", id);
window.location.href = "view-supplier.html";

}

function editSupplier(id){

localStorage.setItem("supplierId", id);
window.location.href = "edit-supplier.html";

}

async function deleteSupplier(id){

if(!confirm("Delete supplier?")) return;

const response = await fetch(
`/api/suppliers/${id}`,
{
method:"DELETE"
}
);

const data = await response.json();

alert(data.message);

loadSuppliers();

}

loadSuppliers();

</script>
    <script src="js/script.js"></script>
  </body>
</html>
