<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="css/login.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="container">
    <div class="left">
      <h2>📦 InventoryPro</h2>
      <p>Your Inventory, Our Priority</p>
    </div>
    <div class="right">
      <div class="login-box">
        <h1>Reset Password</h1>
        <p>Enter your email address. We will send a temporary password if an account exists.</p>
        <form id="forgotPasswordForm">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" autocomplete="email" required>
          <button type="submit">Email Temporary Password</button>
          <p id="message"></p>
        </form>
        <p class="signup"><a href="login.html">Back to Login</a></p>
      </div>
    </div>
</div>
<script src="js/forgot-password.js"></script>
</body>
</html>
